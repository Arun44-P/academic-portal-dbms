<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Emblem Mark (Shield + Academic Cap + Database Nodes) -->
  <g transform="translate(6, 4)">
    <!-- Base Shield -->
    <path d="M20 2 C30 2, 38 6, 38 16 C38 28, 25 36, 20 39 C15 36, 2 28, 2 16 C2 6, 10 2, 20 2 Z" fill="url(#shieldGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Accent Ring/Glow -->
    <path d="M20 5 C28 5, 34 8, 34 16 C34 26, 23 33, 20 35 C17 33, 6 26, 6 16 C6 8, 12 5, 20 5 Z" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-dasharray="2 1" />
    
    <!-- Academic Cap / Mortarboard Icon -->
    <polygon points="20,11 31,16 20,21 9,16" fill="url(#primaryGrad)" />
    <path d="M14 18.5 L14 24 C14 26.5 17 28 20 28 C23 28 26 26.5 26 24 L26 18.5" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
    <!-- Tassel -->
    <path d="M29 17 L29 23" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="29" cy="24" r="1.5" fill="#f59e0b" />
    
    <!-- Database Dots at Bottom of Shield -->
    <circle cx="16" cy="31" r="1.5" fill="#10b981" />
    <circle cx="20" cy="32.5" r="1.5" fill="#60a5fa" />
    <circle cx="24" cy="31" r="1.5" fill="#10b981" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(54, 23)">
    <text x="0" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">ACADEMIA</text>
    <text x="0" y="14" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" letter-spacing="1.2">RESEARCH &amp; DBMS PORTAL</text>
  </g>
</svg>

